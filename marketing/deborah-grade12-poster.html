<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deborah — Choose your score</title>
  <style>
    :root { --green:#173f32; --green-2:#28664f; --gold:#d4a437; --cream:#faf8f2; --ink:#202923; --muted:#68736c; --line:#e5e9e4; --white:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#dfe5df; }
    body { font-family:"Noto Sans Ethiopic",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
    .poster { position:relative; width:1080px; min-height:1350px; margin:0 auto; padding:58px 60px 54px; overflow:hidden; background:radial-gradient(circle at 92% 4%,rgba(212,164,55,.2),transparent 320px),linear-gradient(145deg,var(--cream),#fff 58%,#f1f6f0); }
    .poster:before { content:""; position:absolute; width:540px; height:540px; right:-260px; top:300px; border:48px solid rgba(23,63,50,.055); border-radius:50%; }
    .poster:after { content:""; position:absolute; width:210px; height:210px; left:-120px; bottom:160px; border:28px solid rgba(212,164,55,.12); border-radius:50%; }
    .student-photo { display:block; position:absolute; z-index:0; top:214px; right:60px; width:250px; height:220px; overflow:hidden; border:9px solid rgba(255,255,255,.9); border-radius:30px; background:var(--green); box-shadow:0 20px 36px rgba(23,63,50,.2); transform:rotate(3deg); }
    .student-photo img { width:100%; height:100%; object-fit:cover; object-position:72% center; filter:saturate(.92); }
    .student-photo:after { content:""; position:absolute; inset:0; background:linear-gradient(150deg,transparent 38%,rgba(23,63,50,.5)); pointer-events:none; }
    .top,.hero,.score-section,.cta,.footer { position:relative; z-index:1; }
    .top { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:14px; }
    .logo { width:76px; height:76px; padding:5px; object-fit:contain; border:1px solid rgba(212,164,55,.35); border-radius:23px; background:var(--white); box-shadow:0 10px 24px rgba(23,63,50,.1); }
    .brand-name { margin:0; color:var(--green); font-size:28px; font-weight:900; letter-spacing:-.04em; }
    .brand-line { margin:4px 0 0; color:var(--muted); font-size:11px; font-weight:850; letter-spacing:.16em; text-transform:uppercase; }
    .badge { padding:11px 16px; border:1px solid rgba(212,164,55,.45); border-radius:999px; background:rgba(212,164,55,.13); color:#765516; font-size:13px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .hero { margin-top:74px; max-width:650px; }
    h1 { max-width:650px; margin:0; color:var(--green); font-size:76px; line-height:1; letter-spacing:-.07em; }
    .supporting { max-width:540px; margin:18px 0 0; color:var(--muted); font-size:23px; line-height:1.35; }
    .supporting strong { color:var(--green); }
    .score-section { margin-top:66px; }
    .section-label { margin:0; color:var(--green-2); font-size:17px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    .section-label:after { content:""; display:inline-block; width:34px; height:4px; margin:0 0 4px 11px; border-radius:99px; background:var(--gold); }
    .scores { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:19px; }
    .score { display:flex; min-height:145px; align-items:center; justify-content:center; border:2px solid var(--line); border-radius:25px; background:rgba(255,255,255,.9); box-shadow:0 12px 26px rgba(23,63,50,.07); color:var(--green); cursor:pointer; font:inherit; transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease; }
    .score:nth-child(n+4) { border-color:var(--green); background:var(--green); color:var(--gold); }
    .score:hover, .score:focus-visible { transform:translateY(-3px); border-color:var(--gold); box-shadow:0 16px 30px rgba(23,63,50,.15); outline:none; }
    .score.selected { border-color:var(--gold); box-shadow:0 0 0 5px rgba(212,164,55,.22), 0 16px 30px rgba(23,63,50,.16); transform:translateY(-3px); }
    .score strong { color:inherit; font-size:52px; font-weight:950; letter-spacing:-.08em; }
    .target-description { min-height:54px; margin:14px 0 0; padding:13px 18px; border-left:5px solid var(--gold); border-radius:0 15px 15px 0; background:rgba(212,164,55,.11); color:var(--green); font-size:17px; font-weight:700; line-height:1.35; }
    .cta { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-top:22px; padding:23px 28px; border-radius:27px; background:var(--green); color:var(--white); box-shadow:0 16px 30px rgba(23,63,50,.2); }
    .cta h2 { margin:0; font-size:30px; letter-spacing:-.04em; }
    .cta p { margin:8px 0 0; color:rgba(255,255,255,.76); font-size:16px; line-height:1.4; }
    .button { display:inline-block; flex:0 0 auto; padding:15px 19px; border-radius:13px; background:var(--gold); color:var(--green); font-size:16px; font-weight:900; text-decoration:none; white-space:nowrap; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:27px; color:var(--muted); font-size:14px; font-weight:750; }
    .footer strong { color:var(--green); }
    @media (prefers-reduced-motion:reduce) { .score { transition:none; } }
  </style>
</head>
<body>
  <main class="poster">
    <header class="top">
      <div class="brand"><img class="logo" src="../apps/web/public/images/dibora-logo.png" alt="Deborah logo"><div><p class="brand-name">Deborah</p><p class="brand-line">Learn · Grow · Achieve</p></div></div>
      <div class="badge">Grade 12 · Ethiopia</div>
    </header>
    <a class="student-photo" href="/goal-planner" aria-label="Open the Grade 12 goal planner"><img src="../apps/web/public/images/dibora-farm-poster.jpg" alt="Ethiopian student studying with books"></a>
    <section class="hero">
      <h1>Choose your goal.</h1>
      <p class="supporting">Grade 12 exam prep with Deborah.</p>
    </section>
    <section class="score-section" aria-labelledby="score-title">
      <h2 id="score-title" class="section-label">Tap a target</h2>
      <div class="scores">
        <button class="score" type="button" data-target="300+" aria-pressed="false"><strong>300+</strong></button>
        <button class="score" type="button" data-target="350+" aria-pressed="false"><strong>350+</strong></button>
        <button class="score" type="button" data-target="400+" aria-pressed="false"><strong>400+</strong></button>
        <button class="score" type="button" data-target="450+" aria-pressed="false"><strong>450+</strong></button>
        <button class="score" type="button" data-target="500+" aria-pressed="false"><strong>500+</strong></button>
        <button class="score" type="button" data-target="550+" aria-pressed="false"><strong>550+</strong></button>
      </div>
      <p id="target-description" class="target-description" role="status" aria-live="polite">Tap a score to choose your goal.</p>
    </section>
    <section class="cta">
      <div><h2>Start with Deborah.</h2></div>
      <a class="button" href="/goal-planner">Start your plan →</a>
    </section>
    <footer class="footer"><span><strong>Deborah</strong> · Your study partner</span></footer>
  </main>
  <script>
    (function () {
      var descriptions = {
        '300+': 'Build your foundation.',
        '350+': 'Strengthen core topics.',
        '400+': 'Practise with purpose.',
        '450+': 'Grow your confidence.',
        '500+': 'Review. Practise. Improve.',
        '550+': 'Aim high. Stay consistent.'
      };
      var cards = document.querySelectorAll('[data-target]');
      var description = document.getElementById('target-description');
      cards.forEach(function (card) {
        card.addEventListener('click', function () {
          cards.forEach(function (item) { item.classList.remove('selected'); item.setAttribute('aria-pressed', 'false'); });
          card.classList.add('selected'); card.setAttribute('aria-pressed', 'true');
          var target = card.getAttribute('data-target');
          description.textContent = target + ' goal · ' + descriptions[target];
        });
      });
    }());
  </script>
</body>
</html>
