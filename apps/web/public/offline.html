<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d3b">
  <title>Dibora — Offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#fbf7ee; color:#1d2420; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    main { width:min(560px,100%); text-align:center; background:#fff; border:1px solid #e6dfcd; border-radius:28px; padding:40px 28px; box-shadow:0 12px 35px rgba(11,93,59,.10); }
    img { width:72px; height:72px; object-fit:contain; border-radius:20px; margin-bottom:18px; }
    h1 { margin:0; color:#0b5d3b; font-size:clamp(1.7rem,5vw,2.35rem); }
    p { color:#5d6a63; line-height:1.7; margin:14px auto 0; }
    button { margin-top:24px; border:0; border-radius:14px; padding:13px 20px; background:#0b5d3b; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
    .languages { margin-top:25px; padding-top:20px; border-top:1px solid #e6dfcd; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <img src="/images/dibora-logo.png" alt="Dibora">
    <h1>You are offline</h1>
    <p>አሁን ከኢንተርኔት ውጭ ነዎት።<br>Amma interneetii irraa ala jirta.</p>
    <p>Previously opened Dibora pages may still be available. Reconnect to continue learning and sync your latest activity.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="languages">Dibora · Learn · Grow · Achieve</div>
  </main>
</body>
</html>
